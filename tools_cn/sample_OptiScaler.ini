; -------------------------------------------------------
[FrameGen]
; -------------------------------------------------------
; Enables Frame Generation
; true or false - Default (auto) is false
; With dlssg FG Input, auto follows the game's DLSS FG setting (on/off and frame multiplier)
Enabled=auto

; -------------------------------------------------------
[Upscalers]
; -------------------------------------------------------
; Select Upscaler for Dx12 games
; xess, fsr21, fsr22, ffx (FSR 2.3; 3.1; 4.x), dlss
Dx12Upscaler=auto

; **4.** Marker formatting must survive: **true** or **false**
; * Default (auto) is fsr22
; > _quoted note_ with `code` and 0x2D and 1.5 and 255
; ; not a comment line, this one stays because of the leading semicolon count
