name: Build Chinese (Signed)

# Same thin-repo build as build_zhcn.yml, but the produced OptiScaler.dll is
# submitted to SignPath before packaging. Manual only: every run costs a signing
# request against the signing service, so it is never scheduled.
#
# The SignPath project referenced in the env block below must have its GitHub
# trusted build system bound to THIS repository (SignPath dashboard -> project
# -> trusted build systems -> GitHub). The identifiers themselves are unchanged
# from the fork; only the repository binding has to follow the move.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if this upstream commit was already released'
        type: boolean
        default: false
      upstream_ref:
        description: 'Upstream tag or branch to build (default: master, i.e. the latest nightly)'
        type: string
        required: false
        default: ''

permissions:
  # contents: write publishes the release, actions: read lets the SignPath
  # action download the workflow artifact it is asked to sign.
  contents: write
  actions: read

concurrency:
  group: build-zhcn-signed
  cancel-in-progress: false

env:
  SOLUTION_FILE_PATH: src/OptiScaler.sln
  BUILD_CONFIGURATION: Release
  UPSTREAM_REPOSITORY: optiscaler/OptiScaler
  # Empty input means "master", i.e. the latest nightly. The `|| 'master'`
  # fallback is kept for symmetry with the unsigned workflow even though this
  # one has no schedule trigger.
  UPSTREAM_REF: ${{ inputs.upstream_ref || 'master' }}
  WINDOWS_FONT: C:\Windows\Fonts\msyh.ttc
  # --- SignPath binding: re-bind these for this repository ---
  SIGNPATH_ORGANIZATION_ID: d62571e9-818a-4296-bf46-46db55b1a44e
  SIGNPATH_PROJECT_SLUG: OptiScaler
  SIGNPATH_POLICY_SLUG: release-signing
  # The policy id the old fork was granted; kept for reference and for the notes.
  SIGNPATH_POLICY_ID: 08634ea0-3ec2-46df-8a03-755a138a1565
  # No API base URL any more: the signing request goes through the official
  # signpath/github-action-submit-signing-request action, not through a
  # hand-written REST call.

jobs:
  build:
    name: Build, sign and publish
    runs-on: windows-latest
    timeout-minutes: 90

    # The gh CLI refuses to run inside Actions without GH_TOKEN:
    #   "To use GitHub CLI in a GitHub Actions workflow, set the GH_TOKEN
    #    environment variable."
    # It is set once at job level rather than per step so a future gh call
    # cannot silently inherit the anonymous client again. `permissions:
    # contents: write` above is what grants this token the right to publish;
    # `actions: read` is what the SignPath action needs to fetch the artifact.
    # Reads of the upstream repository go through the same token; public
    # repositories are readable by any authenticated token.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout this repository (tooling)
        uses: actions/checkout@v4
        with:
          path: self
          fetch-depth: 1

      # Fail fast on a ref that does not exist upstream, before the 1.49 GB
      # checkout runs. `actions/checkout` reports an unknown ref only as
      # `fatal: couldn't find remote ref <ref>` buried in its own log, and the
      # most likely bad input is a resource.h macro version such as
      # `v10.0.0-pre1` -- that string is what the macros on master currently
      # spell out (10.0.0 / build 1), but it is not a tag, so it must not be
      # mistaken for one. `gh api` is used rather than git because a failed
      # checkout can leave src/ missing or empty. GH_REPO is set like every
      # other gh step so no call depends on which checkout the cwd is in; the
      # API path below carries owner/repo explicitly, so it addresses the
      # upstream repository regardless of that setting.
      - name: Validate the requested upstream ref
        if: inputs.upstream_ref != ''
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ inputs.upstream_ref }}
          UPSTREAM_REPOSITORY: ${{ env.UPSTREAM_REPOSITORY }}
        run: |
          $sha = gh api "repos/$env:UPSTREAM_REPOSITORY/commits/$env:TARGET" --jq '.sha' 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::upstream ref '$env:TARGET' does not exist in $env:UPSTREAM_REPOSITORY."
            Write-Host "::error::'v10.0.0-pre1' style values are resource.h macro versions on master, not tags. Leave the input empty to build the latest nightly, or pass a real tag such as v0.9.4."
            exit 1
          }
          Write-Host "requested upstream ref $env:TARGET resolves to $sha"

      # No actions/cache here on purpose. Restoring src/.git/modules before the
      # checkout looks like it would save the ~1.49 GB submodule fetch, but
      # actions/checkout's prepareExistingDirectory() deletes everything under
      # the target path whenever repo/.git exists without a usable
      # remote.origin.url -- and the cached modules/ directory carries no
      # .git/config, so the just-restored objects are always thrown away again.
      # A run-scoped key never produces an exact hit, so the post-job save
      # would upload the full object store on every run and never reuse it.
      # Caching it properly needs `submodules: false` plus an explicit
      # `git submodule update --init --recursive`, which adds a new failure
      # mode that can only be validated on a real runner. Not worth it yet.
      - name: Checkout upstream sources
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REF }}
          path: src
          fetch-depth: 1
          submodules: recursive

      - name: Resolve upstream revision
        id: upstream
        shell: pwsh
        env:
          UPSTREAM_REF: ${{ env.UPSTREAM_REF }}
        run: |
          $sha = (git -C src rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($sha)) {
            Write-Host "::error::could not resolve the upstream commit"
            exit 1
          }
          $describe = (git -C src describe --tags --always).Trim()
          if ([string]::IsNullOrWhiteSpace($describe)) { $describe = "unknown" }
          # When the operator pinned a tag, describe should report that tag
          # rather than a bare short SHA: `fetch-depth: 1` carries no tag
          # objects, so `git describe --tags` degrades to the abbreviated SHA.
          if ($env:UPSTREAM_REF -and $env:UPSTREAM_REF -ne "master") {
            $describe = $env:UPSTREAM_REF
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "describe=$describe" >> $env:GITHUB_OUTPUT
          Write-Host "upstream sha      : $sha"
          Write-Host "upstream describe : $describe"

      - name: Skip when this upstream commit is already released
        id: check
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          $skip = "false"
          if ($env:FORCE -eq "true") {
            Write-Host "force was requested, building anyway"
          }
          else {
            $marker = "upstream-sha: $env:UPSTREAM_SHA"
            $found = ""
            # The marker is the commit SHA, so a tag build is covered by the same
            # logic: the tag resolves to a commit, and rebuilding that tag skips
            # correctly. When a tag and master point at the same commit they are
            # the same product, which is intended -- use `force` to rebuild.
            #
            # GH_REPO pins gh to this repository: the workspace holds two git
            # checkouts (self/ and src/) and gh would otherwise guess wrong.
            #
            # The releases API is queried directly instead of the `gh` list
            # subcommand: that subcommand has no `body` field at all and fails
            # outright with `Unknown JSON field: "body"`. The failure used to be
            # hidden by redirecting stderr to null, which left $raw empty and
            # took the "no release yet" branch -- so the log looked healthy
            # while $LASTEXITCODE stayed at 1 and failed the whole step, and the
            # skip check could never match a marker. Redirecting stderr into
            # stdout puts the error text into the log, and a failure exits
            # immediately rather than pretending to succeed.
            $raw = gh api "repos/$env:GH_REPO/releases?per_page=30" --jq '[.[] | {tag: .tag_name, body: .body}]' 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::could not list releases: $raw"
              exit 1
            }
            # `--jq` prints nothing for a repository without releases and a JSON
            # array otherwise; normalise both to something the foreach can walk.
            $releases = if ([string]::IsNullOrWhiteSpace($raw)) { @() } else { $raw | ConvertFrom-Json }
            foreach ($rel in $releases) {
              if ($null -ne $rel.body -and $rel.body -like "*$marker*" -and $rel.tag -like "zh-cn-signed-*") {
                $found = $rel.tag
                break
              }
            }
            if ($found) {
              $skip = "true"
              Write-Host "upstream $env:UPSTREAM_SHA is already published as $found"
              $summary = @(
                "## Skipped: upstream unchanged",
                "",
                "Upstream commit $env:UPSTREAM_SHA is already published in release $found.",
                "",
                "Re-run this workflow with **force** enabled to rebuild anyway."
              )
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary -Encoding utf8
            }
            else {
              Write-Host "no signed release yet for upstream $env:UPSTREAM_SHA"
            }
          }
          # PowerShell 7 keeps $LASTEXITCODE across statements and converts a
          # leftover non-zero value into a step failure at the end of the step.
          # Everything that must fail has already exited above, so clear it
          # explicitly instead of relying on the last external command.
          $global:LASTEXITCODE = 0
          "skip=$skip" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install font tooling
        if: steps.check.outputs.skip != 'true'
        run: python -m pip install --disable-pip-version-check fonttools

      - name: Generate the embedded CJK font header
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          # build_font.py resolves its own font source: bundled
          # tools_cn/msyh_cjk.ttf first, then the system file, then a hard error.
          # WINDOWS_FONT is only forwarded when it exists on the runner.
          $fontArgs = @('--out', 'src/OptiScaler/menu/font', '--dict', 'self/tools_cn/dict_v10.json')
          if ($env:WINDOWS_FONT -and (Test-Path -LiteralPath $env:WINDOWS_FONT)) {
            Write-Host "using system font $env:WINDOWS_FONT"
            $fontArgs += @('--source', $env:WINDOWS_FONT)
          }
          else {
            Write-Host "system font not present, letting build_font.py fall back"
          }
          python self/tools_cn/build_font.py @fontArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inject the Chinese translations and the font merge block
        if: steps.check.outputs.skip != 'true'
        run: >-
          python self/tools_cn/localize.py
          --repo src
          --tools self/tools_cn

      - name: Localize the OptiScaler.ini comments
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          python self/tools_cn/localize_ini.py --ini src/OptiScaler.ini --dict self/tools_cn/dict_ini.json --out src/OptiScaler.ini --report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python self/tools_cn/localize_ini.py --ini src/OptiScaler.ini --dict self/tools_cn/dict_ini.json --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add MSBuild to PATH
        if: steps.check.outputs.skip != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Compile
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          msbuild $env:SOLUTION_FILE_PATH /m /p:Configuration=$env:BUILD_CONFIGURATION /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the build output
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ok = $true
          foreach ($f in @("src/x64/Release/a/OptiScaler.dll", "src/x64/Release/a/OptiScaler.ini")) {
            if (Test-Path $f) {
              Write-Host ("{0}  {1} bytes" -f $f, (Get-Item $f).Length)
            }
            else {
              Write-Host "::error::missing build output $f"
              $ok = $false
            }
          }
          if (-not $ok) {
            Get-ChildItem -Path src/x64 -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object -First 40 FullName | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }

      # ------------------------------------------------------------------
      # SignPath, official trusted-build path
      #
      # The artifact has to exist as a workflow artifact first and the signing
      # request points at it by `github-artifact-id`; SignPath only accepts
      # trusted-build submissions that way. The hand-written REST sequence this
      # workflow used before (SubmitWithArtifact, polling /Status, downloading
      # /SignedArtifact) is not accepted for a trusted build system.
      #
      # - v2 and v3 both run on node24 and differ only in their default
      #   connector-url: v3 talks to the pipelineconnector endpoint, which is
      #   the one a trusted build system must use. Do not downgrade to v2.
      # - `output-artifact-directory` implies skip-decompress=false, so the
      #   action expands the signed ZIP itself: the dll ends up at
      #   dist/signed/OptiScaler.dll. No unzip step is needed here.
      # - No continue-on-error on purpose: a failed signature fails the run
      #   instead of shipping an unsigned binary under a "signed" tag.
      # ------------------------------------------------------------------
      - name: Upload the unsigned dll for signing
        id: upload-unsigned
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-zhcn-unsigned
          path: src/x64/Release/a/OptiScaler.dll
          if-no-files-found: error
          compression-level: 9

      - name: Submit the signing request to SignPath
        id: signpath
        if: steps.check.outputs.skip != 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # The action defaults to 600 s; a manual approval in the SignPath
          # policy can easily outlast that, and the job itself is allowed 90
          # minutes, so the wait is raised to 1800 s.
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: dist/signed

      - name: Confirm the signature is present
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          # Copy explicitly: everything downstream (packaging, the GPL source
          # bundle, the uploaded artifact) must see one signed binary.
          $signed = "dist/signed/OptiScaler.dll"
          if (-not (Test-Path $signed)) {
            # skip-decompress defaults to false, so the archive is extracted
            # directly into the directory; a nested folder inside the ZIP would
            # still land one level deeper, so fall back to a search.
            $found = @(Get-ChildItem -Path dist/signed -Filter "OptiScaler.dll" -File -Recurse -ErrorAction SilentlyContinue)
            if ($found.Count -ge 1) {
              $signed = $found[0].FullName
              Write-Host "signed dll found at $signed"
            }
          }
          if (-not (Test-Path $signed)) {
            Get-ChildItem -Path dist -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object -First 20 FullName | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host "::error::no signed OptiScaler.dll under dist/signed; the SignPath action did not produce one"
            exit 1
          }

          $dll = "src/x64/Release/a/OptiScaler.dll"
          Copy-Item $signed $dll -Force
          Write-Host ("signed OptiScaler.dll  {0} bytes" -f (Get-Item $dll).Length)

          $sig = Get-AuthenticodeSignature $dll
          Write-Host "signature status: $($sig.Status)"
          Write-Host "signer          : $($sig.SignerCertificate.Subject)"
          # The policy uses a SignPath test certificate, so `NotTrusted` is the
          # expected status on a runner without the SignPath root installed.
          # What must never happen is an unsigned binary under a signed tag.
          if ("$($sig.Status)" -eq "NotSigned" -or $null -eq $sig.SignerCertificate) {
            Write-Host "::error::the packaged dll would be unsigned, aborting"
            exit 1
          }
          (Get-FileHash $dll -Algorithm SHA256 | Out-String).Trim() | Write-Host

      - name: Derive the version and the asset names
        id: version
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          UPSTREAM_DESCRIBE: ${{ steps.upstream.outputs.describe }}
          UPSTREAM_REF: ${{ env.UPSTREAM_REF }}
        run: |
          $defines = @{}
          $names = @("VER_MAJOR_VERSION", "VER_MINOR_VERSION", "VER_HOTFIX_VERSION", "VER_BUILD_NUMBER")
          $candidates = @(
            "src/OptiScaler/resource.h",
            "src/OptiScaler/version.h",
            "src/OptiScaler/OptiScaler.h",
            "src/OptiScaler/menu/menu_common.h"
          )
          foreach ($c in $candidates) {
            if ($defines.Count -eq $names.Count) { break }
            if (-not (Test-Path -LiteralPath $c)) { continue }
            $text = Get-Content -LiteralPath $c -Raw
            if ([string]::IsNullOrEmpty($text)) { continue }
            foreach ($n in $names) {
              if (-not $defines.ContainsKey($n)) {
                $m = [regex]::Match($text, "#define\s+$n\s+(\d+)")
                if ($m.Success) {
                  $defines[$n] = $m.Groups[1].Value
                  Write-Host "  $n = $($m.Groups[1].Value)  ($c)"
                }
              }
            }
          }

          # Priority 1: an explicitly requested tag wins over the macros. The
          # macros only describe the commit they sit on, so on master they read
          # 10.0.0 / build 1 ("v10.0.0-pre1", the current nightly) while every
          # released tag carries its own numbers -- building v0.9.4 with the
          # macro path would be right only by coincidence. Preferring the
          # requested tag keeps the asset name matching what was asked for.
          # Priority 2: the four resource.h macros (the normal master build).
          # Priority 3: git describe, so an older snapshot without the macros
          # still produces a name instead of failing the build.
          if ($env:UPSTREAM_REF -and $env:UPSTREAM_REF -ne "master") {
            # Strip a single leading "v" and re-add it, so both "v0.9.4" and
            # "0.9.4" end up as "v0.9.4" and never as "vv0.9.4".
            $tag = $env:UPSTREAM_REF -replace '^v', ''
            $version = "v$tag"
            Write-Host "version taken from the requested upstream ref $env:UPSTREAM_REF"
          }
          elseif ($defines.Count -eq $names.Count) {
            $version = "v$($defines['VER_MAJOR_VERSION']).$($defines['VER_MINOR_VERSION']).$($defines['VER_HOTFIX_VERSION'])-pre$($defines['VER_BUILD_NUMBER'])"
            Write-Host "version taken from the source macros"
          }
          else {
            # An older or normalized upstream snapshot does not always carry the
            # four macros. Never fail the build over the file name: fall back to
            # git describe and keep going.
            $missing = ($names | Where-Object { -not $defines.ContainsKey($_) }) -join ", "
            Write-Host "::warning::version macros not found ($missing), falling back to git describe"
            $safe = ($env:UPSTREAM_DESCRIBE -replace '[^0-9A-Za-z._-]', '_')
            # `git describe` normally returns "v0.9.2-12-g429af9c", so the
            # leading "v" has to go before one is prepended again -- otherwise
            # the asset name reads "vv0.9.2-12-g429af9c".
            $safe = $safe -replace '^v', ''
            if ([string]::IsNullOrWhiteSpace($safe)) { $safe = "unknown" }
            $version = "v$safe"
          }

          $date = (Get-Date).ToUniversalTime().ToString("yyyyMMdd")
          $filename = "OptiScaler_${version}_$date"
          "version=$version"   >> $env:GITHUB_OUTPUT
          "date=$date"         >> $env:GITHUB_OUTPUT
          "filename=$filename" >> $env:GITHUB_OUTPUT
          "archive=OptiScaler-zhcn_${version}_$date.7z" >> $env:GITHUB_OUTPUT
          Write-Host "version  : $version"
          Write-Host "filename : $filename"

      - name: Package OptiScaler.dll and OptiScaler.ini
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          $staging = "dist/stage"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "src/x64/Release/a/OptiScaler.dll" $staging -Force
          Copy-Item "src/x64/Release/a/OptiScaler.ini" $staging -Force
          $archive = Join-Path (Resolve-Path "dist").Path $env:ARCHIVE
          # Bare file names, run from inside the staging folder: the archive stays
          # flat, no directory prefix inside the .7z.
          Push-Location $staging
          try {
            7z a -t7z -mx=9 "$archive" OptiScaler.dll OptiScaler.ini
            if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
          }
          finally { Pop-Location }
          Write-Host "archive contents:"
          7z l "$archive"

      - name: Collect the GPL-3.0 corresponding source
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          # Passed through the environment rather than interpolated inline: a
          # literal ${{ ... }} inside a PowerShell double-quoted string parses as
          # a variable name and trips PSScriptAnalyzer even though the runner
          # substitutes it before the script runs.
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dist = (Resolve-Path dist).Path
          $srcRoot = (Resolve-Path src).Path

          # Snapshot the submodule status before the overlay commit below: after
          # an `git add -A` the recorded gitlinks would match whatever is checked
          # out, so this snapshot is the only place that still knows whether the
          # build used exactly the commits upstream pins.
          $lines = @(git -C src submodule status --recursive)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # `git archive HEAD` exports the commit tree, not the working
          # directory, so the localized sources would be missing from the bundle
          # unless they are committed first: menu_common.cpp would ship as the
          # pristine English file, OptiScaler.ini as the English original, and
          # the freshly generated OptiScaler/menu/font/CJK_Compressed.h would not
          # be in the bundle at all. A throwaway commit on top of the upstream
          # checkout freezes the patched tree into the object store. The upstream
          # SHA the release notes advertise was captured earlier by the
          # `Resolve upstream revision` step and is written to upstream-sha.txt
          # at the end of this step, so the skip check keeps working tomorrow.
          # Build products stay out of that commit because the upstream
          # .gitignore already covers x64/, [Rr]elease/, *.dll, *.pdb, *.obj,
          # *.lib, *.log, *.user plus the MSBuild generated
          # /OptiScaler/resource_build_*.h and /OptiScaler/misc/Telemetry.*.
          # What is left to stage is exactly the overlay: the translated
          # menu_common.cpp, the localized OptiScaler.ini and the generated
          # font header.
          git -C src add -A
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::git add -A failed"; exit 1 }
          # `git diff --cached` is asked instead of `git status`: it lists exactly
          # what the next commit would contain, so an empty result can skip the
          # commit instead of letting `git commit` fail with "nothing to commit".
          $staged = @(git -C src diff --cached --name-only)
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::git diff --cached failed"; exit 1 }
          if ($staged.Count -gt 0) {
            Write-Host "committing $($staged.Count) path(s) into the overlay"
            $staged | ForEach-Object { Write-Host "  $_" }
            git -C src -c user.name="OptiScaler zh-cn build" -c user.email="zh-cn-build@users.noreply.github.com" -c commit.gpgsign=false commit --no-verify -m "zh-cn localization overlay (generated during the build)"
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not commit the localization overlay"; exit 1 }
          }
          else {
            Write-Host "no working tree change to commit; the bundle holds the pristine upstream tree"
          }
          # The bundle must be verifiably the patched tree: anything left
          # uncommitted would silently drop out of the archive, so a non-empty
          # list here means the bundle is incomplete. Ignored build products
          # never appear in it, and --ignore-submodules=dirty keeps a submodule
          # work tree that merely has local edits from raising a false alarm
          # (a submodule that was moved to a different commit still shows).
          $leftover = @(git -C src status --porcelain --ignore-submodules=dirty)
          if ($leftover.Count -gt 0) {
            Write-Host "::warning::still uncommitted after the overlay commit:"
            $leftover | ForEach-Object { Write-Host "  $_" }
          }
          # `git status` cannot see this failure mode: a file that an ignore rule
          # matches is invisible to it, so the overlay commit would succeed with
          # the file silently absent and the bundle would ship without it. Ask
          # the commit itself instead. These three paths are what the two
          # generators always produce, so they have to be in the tree after the
          # overlay commit; anything missing means an ignore rule or a failed
          # generator broke the correspondence between binary and source.
          $tracked = @(git -C src ls-tree -r --name-only HEAD)
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::git ls-tree failed"; exit 1 }
          foreach ($required in @(
              "OptiScaler/menu/menu_common.cpp",
              "OptiScaler/OptiScaler.ini",
              "OptiScaler/menu/font/CJK_Compressed.h")) {
            if ($tracked -notcontains $required) {
              Write-Host "::error::$required is not in the commit that the source bundle is built from; an ignore rule or a failed generator dropped it"
              exit 1
            }
          }

          # GPL-3.0 section 6: whoever distributes the binary must also make the
          # corresponding source available. Corresponding source covers the
          # linked submodules too, so `git -C src archive HEAD` alone is not
          # enough -- it only contains the top-level tree plus the gitlink
          # entries. (The top-level tree itself is complete: the overlay commit
          # above put the localized sources and the generated font header into
          # HEAD, which is why the archive below holds the patched code rather
          # than the pristine upstream files. What is still missing is the
          # content *behind* each gitlink.) Every initialised submodule is
          # therefore archived at its own path inside the bundle as well.
          $stage = Join-Path $dist "source"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # 1. the main repository
          git -C src archive --format=zip -o "$dist/main.zip" HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive "$dist/main.zip" -DestinationPath $stage -Force
          Remove-Item "$dist/main.zip"

          # 2. every initialised submodule, archived into its own path.
          # `submodule status --recursive` is used instead of parsing
          # .gitmodules because .gitmodules only declares the direct children;
          # nested submodules would silently be missing from the bundle. The
          # leading status character tells whether a work tree exists at all:
          # '-' means the submodule was never initialised (git only knows the
          # recorded SHA), so it cannot be archived and is skipped loudly.
          # $lines was captured before the overlay commit; see the comment there.
          $shas = Join-Path $dist "submodule-shas.txt"
          if (Test-Path $shas) { Remove-Item $shas -Force }
          $archived = 0
          foreach ($line in $lines) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            if ($line -notmatch '^([ +\-U])([0-9a-f]{40,64}) (\S.*?)(?: \([^)]*\))?$') {
              Write-Host "::warning::could not parse submodule status line '$line'"
              continue
            }
            $state = $Matches[1]
            $recordedSha = $Matches[2]
            $p = $Matches[3]
            if ($state -eq '-') {
              Write-Host "::warning::submodule $p is not initialized, skipped from the source bundle"
              continue
            }
            $target = Join-Path $srcRoot $p
            if (-not (Test-Path -LiteralPath $target)) {
              Write-Host "::warning::submodule path $p does not exist on disk, skipped"
              continue
            }
            $subSha = (git -C $target rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($subSha)) {
              Write-Host "::error::could not resolve the checked out commit of submodule $p"
              exit 1
            }
            $out = Join-Path $dist ("sub-" + ($p -replace '[\\/]', '-') + ".zip")
            git -C $target archive --format=zip -o $out HEAD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $dest = Join-Path $stage $p
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Expand-Archive $out -DestinationPath $dest -Force
            Remove-Item $out
            $note = ""
            if ($subSha -ne $recordedSha) { $note = "  (recorded $recordedSha, checked out $subSha)" }
            Add-Content -Path $shas -Value "$p $subSha$note"
            Write-Host "archived submodule $p @ $subSha$note"
            $archived++
          }
          if ($archived -eq 0) {
            Write-Host "::warning::no submodule was archived; corresponding-source.zip only holds the main repository"
          }

          # Compress-Archive is documented to choke on entries above 2 GB; the
          # whole source tree is ~1.5 GB before compression, so the merged zip
          # stays far below that. The size check below makes a surprise loud
          # instead of leaving a corrupt release attachment behind.
          $bundle = Join-Path $dist "corresponding-source.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $bundle -Force
          Remove-Item $stage -Recurse -Force

          # Written from the pre-overlay snapshot for the same reason as
          # upstream-sha.txt: after `git add -A` the index may describe the
          # working tree rather than the commits upstream actually pins.
          $lines | Out-File -FilePath "$dist/submodules.txt" -Encoding utf8
          # Not `git -C src rev-parse HEAD`: HEAD is the throwaway overlay commit
          # now. The advertised upstream SHA comes from the `Resolve upstream
          # revision` step, which ran before the overlay, so the `upstream-sha:`
          # marker in the release notes stays true and the next scheduled run
          # still recognises this commit as already released.
          $env:UPSTREAM_SHA | Out-File -FilePath "$dist/upstream-sha.txt" -Encoding utf8

          $size = (Get-Item $bundle).Length
          Write-Host ("corresponding-source.zip  {0} bytes ({1:N1} MB)" -f $size, ($size / 1MB))
          if ($size -gt 1.5GB) {
            Write-Host "::warning::corresponding-source.zip is larger than 1.5 GB; GitHub release assets are limited to 2 GB per file"
          }
          Get-ChildItem dist | Format-Table Name, Length -AutoSize | Out-String | Write-Host

      - name: Render the release notes
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          UPSTREAM_DESCRIBE: ${{ steps.upstream.outputs.describe }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
          UPSTREAM_REF: ${{ env.UPSTREAM_REF }}
        run: |
          $env:BUILD_DATE = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          # render_notes.py fails when a placeholder in the template has no
          # value, so BUILD_TARGET_NOTICE must be set on both branches -- the
          # master build gets its own notice rather than an empty string.
          # An array joined with "`n" is used instead of a here-string: a
          # here-string terminator has to sit in column 1, which would break
          # out of the YAML block scalar this script lives in. Single-quoted
          # strings leave the Markdown backticks alone, so they need no
          # doubling and render as one backtick each.
          if ($env:UPSTREAM_REF -and $env:UPSTREAM_REF -ne "master") {
            $notice = @(
              ('> **构建目标**：上游 tag `' + $env:UPSTREAM_REF + '`（历史版本）。'),
              '> 汉化字典基于 `master` 编写；该版本中措辞已被上游改动的注释会保留英文原文，',
              '> 因此本包的中文完整度低于夜间测试版。配置项与取值不受影响。'
            ) -join "`n"
          }
          else {
            $notice = @(
              '> **构建目标**：上游 `master` 最新提交（夜间测试版）。',
              '> 汉化字典与本版本同步维护，注释完整度最高。'
            ) -join "`n"
          }
          $env:BUILD_TARGET_NOTICE = $notice.Trim()
          # The SignPath identifiers come from the workflow level env block and
          # are spelled out in the notes, so a stale binding is visible on the
          # release page and not only inside the workflow file.
          python self/tools_cn/render_notes.py --template self/.github/release-notes-signed.md --out dist/notes.md --require UPSTREAM_SHA UPSTREAM_DESCRIBE BUILD_DATE ARCHIVE VERSION BUILD_TARGET_NOTICE SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_POLICY_SLUG SIGNPATH_POLICY_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the build artifacts
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-zhcn-signed-${{ steps.version.outputs.filename }}
          if-no-files-found: error
          path: |
            dist/*.7z
            dist/corresponding-source.zip
            dist/submodules.txt
            dist/submodule-shas.txt
            dist/notes.md

      - name: Publish the release
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          TAG: zh-cn-signed-${{ steps.version.outputs.filename }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
          FILENAME: ${{ steps.version.outputs.filename }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Tags are managed through the API on purpose: the working directory is
          # not this repository's checkout, so any git-side tag deletion would
          # target the wrong repository.
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "replacing existing release $env:TAG"
            gh release delete "$env:TAG" --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          # Built as a list because submodule-shas.txt only exists when the
          # upstream actually declares initialised submodules.
          $assets = @(
            "dist/$env:ARCHIVE",
            "dist/corresponding-source.zip",
            "dist/submodules.txt",
            "dist/upstream-sha.txt"
          )
          if (Test-Path "dist/submodule-shas.txt") { $assets += "dist/submodule-shas.txt" }

          gh release create "$env:TAG" @assets `
            --title "OptiScaler 简体中文（已签名） $env:VERSION ($env:FILENAME)" `
            --notes-file dist/notes.md `
            --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "published $env:TAG"
