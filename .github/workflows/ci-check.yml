name: CI

# Fast repository-only checks. This workflow never checks out the upstream
# sources: it validates the tooling that the thin repository ships.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tooling checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml fonttools

      - name: Byte-compile the tooling
        run: python3 -m py_compile tools_cn/*.py tools_cn/selftests/*.py

      - name: stb_compress / stb_decompress round-trip self test
        run: python3 tools_cn/build_font.py --selftest

      - name: Anchor drift regression test
        run: python3 tools_cn/selftests/run_drift_selftest.py

      - name: verify_binary.py self test
        # The real artifact check can only run on the Windows build, so its
        # logic is pinned here against synthetic files: a hit must pass, a miss
        # must fail, and an invocation without expectations must be refused
        # (otherwise the build step could pass vacuously).
        run: |
          set -eu
          tmp="$(mktemp -d)"
          python3 - "$tmp" <<'PY'
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          root.joinpath('good.dll').write_bytes(
              b'MZ' + b'\x00' * 64 + '重投影设置'.encode('utf-8') + b'\x00' * 16
              + '正在打开 ImGui'.encode('utf-8') + b'\x00' * 32)
          # A mojibake build: the same characters re-encoded as GBK never
          # contains the UTF-8 byte sequence.
          root.joinpath('gbk.dll').write_bytes(
              b'MZ' + b'\x00' * 64 + '重投影设置'.encode('gbk') + b'\x00' * 32)
          PY
          python3 tools_cn/verify_binary.py --dll "$tmp/good.dll" \
            --expect-utf8 "重投影设置" --expect-utf8 "正在打开 ImGui"
          if python3 tools_cn/verify_binary.py --dll "$tmp/gbk.dll" \
               --expect-utf8 "重投影设置"; then
            echo "ERROR: verify_binary.py accepted an ANSI-encoded build" >&2
            exit 1
          fi
          if python3 tools_cn/verify_binary.py --dll "$tmp/good.dll"; then
            echo "ERROR: verify_binary.py passed with no expectations" >&2
            exit 1
          fi
          echo "verify_binary.py self test OK"

      - name: verify_signature.py self test
        # The Authenticode check itself only runs on the Windows build, against
        # the real dll. Its PE parser is plain structure reading (DOS header ->
        # OptionalHeader -> security data directory -> WIN_CERTIFICATE), with no
        # dependency on the Windows trust store, so it can be pinned here with
        # synthetic images: a signed image naming the expected subject passes, a
        # missing or malformed certificate table fails, and a one-character
        # subject must never be satisfied by random DER bytes.
        run: python3 tools_cn/verify_signature.py --self-test

      - name: Legacy code page stdout guard
        # The Windows build runner hands Python a cp1252 stdout. Every tool in
        # tools_cn prints Chinese on at least one diagnostic path, so a missing
        # reconfigure() turns a *successful* check into UnicodeEncodeError and
        # fails the step with a stack trace instead of a verdict. That already
        # happened once (run 43832767932, step 15) and this job could not see it,
        # because ubuntu-latest defaults to UTF-8. Force the legacy code page
        # here so the guard is exercised on every push.
        run: |
          set -eu
          tmp="$(mktemp -d)"
          python3 - "$tmp" <<'PY'
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          root.joinpath('good.dll').write_bytes(
              b'MZ' + b'\x00' * 64 + '重投影设置'.encode('utf-8') + b'\x00' * 16)
          PY
          export PYTHONIOENCODING=cp1252
          python3 tools_cn/verify_binary.py --dll "$tmp/good.dll" \
            --expect-utf8 "重投影设置"
          # A miss must still exit non-zero with a readable message, not a crash.
          if python3 tools_cn/verify_binary.py --dll "$tmp/good.dll" \
               --expect-utf8 "正在打开 ImGui"; then
            echo "ERROR: verify_binary.py accepted a missing string" >&2
            exit 1
          fi
          # The other tools must at least survive --help under the legacy page.
          for tool in localize.py localize_ini.py build_font.py render_notes.py \
                      verify_binary.py verify_signature.py; do
            python3 "tools_cn/$tool" --help > /dev/null
          done
          echo "legacy code page stdout guard OK"

      - name: Validate the translation dictionary
        run: python3 tools_cn/localize.py --check-dict --tools tools_cn

      - name: Validate the ini comment dictionary
        # --check requires --out, so translate the sample to a scratch file first
        # and then assert that the scratch file is byte-identical to a fresh
        # translation. Without --out the on-disk comparison would be skipped and
        # the step would only be checking the invariants of an in-memory copy.
        run: |
          set -eu
          tmp="$(mktemp -d)"
          python3 tools_cn/localize_ini.py \
            --ini tools_cn/sample_OptiScaler.ini \
            --dict tools_cn/dict_ini.json \
            --out "$tmp/sample.ini" --report
          python3 tools_cn/localize_ini.py \
            --ini tools_cn/sample_OptiScaler.ini \
            --dict tools_cn/dict_ini.json \
            --out "$tmp/sample.ini" --check

      - name: Validate the ini comment dictionary shape
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          # The comment dictionary is read-only here: this job never writes it.
          # It only asserts the shape split_comment() relies on - every key must
          # be the comment body with no surrounding whitespace, because the
          # ";   " prefix and any trailing spaces are restored from the line
          # itself, not from the dictionary.
          path = pathlib.Path('tools_cn/dict_ini.json')
          raw = path.read_bytes()
          problems = []
          if raw.startswith(b'\xef\xbb\xbf'):
              problems.append('file has a UTF-8 BOM')
          try:
              table = json.loads(raw.decode('utf-8'))
          except (UnicodeDecodeError, ValueError) as exc:
              print(f'{path}: not valid JSON: {exc}', file=sys.stderr)
              sys.exit(1)
          if not isinstance(table, dict):
              print(f'{path}: must contain a JSON object', file=sys.stderr)
              sys.exit(1)
          for key, value in table.items():
              if not isinstance(value, str):
                  problems.append(f'{key!r}: value is not a string')
                  continue
              if key != key.strip():
                  problems.append(f'{key!r}: key has leading/trailing whitespace')
              if value != value.strip():
                  problems.append(f'{key!r}: value has leading/trailing whitespace')
              if not key.strip():
                  problems.append('empty key')
              if not value.strip():
                  problems.append(f'{key!r}: empty value')
              for field, text in (('key', key), ('value', value)):
                  if '\n' in text or '\r' in text:
                      problems.append(f'{key!r}: {field} contains a newline')
          for line in problems[:20]:
              print(line, file=sys.stderr)
          print(f'{path}: {len(table)} entries, {len(problems)} shape problem(s)')
          sys.exit(1 if problems else 0)
          PY

      - name: Check the coverage baseline is well-formed
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import pathlib
          import re
          import sys

          # Offline on purpose: checking the baseline's shape must not drag a
          # 1.5 GB upstream checkout into a job that otherwise finishes in
          # seconds. The real coverage comparison runs in the build workflows,
          # against a fresh upstream checkout.
          path = pathlib.Path('tools_cn/coverage-baseline.json')
          if not path.exists():
              print(f'{path}: missing; the build workflows compare the coverage '
                    f'against this file', file=sys.stderr)
              sys.exit(1)
          raw = path.read_bytes()
          problems = []
          if raw.startswith(b'\xef\xbb\xbf'):
              problems.append('file has a UTF-8 BOM')
          try:
              data = json.loads(raw.decode('utf-8'))
          except (UnicodeDecodeError, ValueError) as exc:
              print(f'{path}: not valid JSON: {exc}', file=sys.stderr)
              sys.exit(1)
          if not isinstance(data, dict):
              print(f'{path}: must contain a JSON object', file=sys.stderr)
              sys.exit(1)

          sha = data.get('upstream_sha')
          if not isinstance(sha, str) or not re.fullmatch(r'[0-9a-f]{40}', sha):
              problems.append(f'upstream_sha must be 40 lowercase hex characters, '
                              f'got {sha!r}')

          stamp = data.get('recorded_at')
          try:
              datetime.datetime.fromisoformat(str(stamp))
          except (TypeError, ValueError):
              problems.append(f'recorded_at must be an ISO-8601 timestamp, got {stamp!r}')

          translated = data.get('translated')
          total = data.get('total')
          for name, value in (('translated', translated), ('total', total)):
              if not isinstance(value, int) or isinstance(value, bool) or value <= 0:
                  problems.append(f'{name} must be a positive integer, got {value!r}')
          if (isinstance(translated, int) and isinstance(total, int)
                  and not isinstance(translated, bool) and not isinstance(total, bool)
                  and 0 < total < translated):
              problems.append(f'translated ({translated}) cannot exceed total ({total})')

          note = data.get('note')
          if not isinstance(note, str) or not note.strip():
              problems.append('note must explain why the baseline was re-recorded')

          for line in problems:
              print(line, file=sys.stderr)
          print(f'{path}: {len(data)} field(s), {len(problems)} problem(s)')
          sys.exit(1 if problems else 0)
          PY

      - name: Validate every workflow file
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import yaml

          failed = False
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              with open(path, encoding='utf-8') as handle:
                  doc = yaml.safe_load(handle)
              if not isinstance(doc, dict) or not doc:
                  print(f'{path}: not a non-empty mapping', file=sys.stderr)
                  failed = True
                  continue
              jobs = doc.get('jobs')
              if not isinstance(jobs, dict) or not jobs:
                  print(f'{path}: no jobs', file=sys.stderr)
                  failed = True
                  continue
              print(f'{path}: OK ({", ".join(jobs)})')
          sys.exit(1 if failed else 0)
          PY

      - name: Check for tabs, BOMs and CRLF line endings
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          # Only the paths this repository actually ships are scanned. Local
          # scratch directories that may exist next to a working copy (an
          # upstream checkout under OptiScaler/, a verify/ or _ini/ workspace)
          # are never committed and are deliberately out of scope.
          roots = [pathlib.Path('tools_cn'), pathlib.Path('.github')]
          candidates = [p for root in roots if root.is_dir() for p in root.rglob('*')]
          candidates += [pathlib.Path(name) for name in
                         ('README.md', 'MIGRATION.md', 'LICENSE',
                          '.gitignore', '.gitattributes')]

          suffixes = {'.py', '.json', '.md', '.yml', '.ini', '.cpp',
                      '.gitignore', '.gitattributes'}
          bad = []
          for path in sorted(candidates):
              if not path.is_file():
                  continue
              if path.suffix not in suffixes and path.name not in ('.gitignore', '.gitattributes'):
                  continue
              data = path.read_bytes()
              if data.startswith(b'\xef\xbb\xbf'):
                  bad.append(f'{path}: UTF-8 BOM (rewrite the file as UTF-8 without BOM)')
              if b'\r\n' in data:
                  bad.append(f'{path}: CRLF line endings (this repository is LF only)')
              if b'\t' in data and path.suffix in {'.yml', '.py'}:
                  bad.append(f'{path}: tab character (YAML and Python must use spaces)')
          for line in bad:
              print(line, file=sys.stderr)
          print(f'scanned {len(candidates)} path(s), {len(bad)} problem(s)')
          sys.exit(1 if bad else 0)
          PY
